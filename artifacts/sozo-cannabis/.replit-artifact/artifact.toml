kind = "web"
previewPath = "/"
title = "Sozo Cannabis"
version = "1.0.0"
id = "artifacts/sozo-cannabis"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20630

[services.development]
run = "pnpm --filter @workspace/sozo-cannabis run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sozo-cannabis", "run", "build" ]
publicDir = "artifacts/sozo-cannabis/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20630"
BASE_PATH = "/"
